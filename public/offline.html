<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LITN — Offline</title>
  <meta name="theme-color" content="#132028" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #132028;
      color: #f0fdf4;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(20, 184, 166, 0.25), transparent);
    }
    .card {
      background: rgba(30, 47, 58, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }
    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem auto;
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.15), rgba(234, 179, 8, 0.15));
      border: 1px solid rgba(45, 212, 191, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-container svg {
      width: 40px;
      height: 40px;
      color: #2dd4bf;
    }
    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #14b8a6, #2dd4bf);
      color: #0f172a;
      font-weight: 600;
      font-size: 0.9375rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(45, 212, 191, 0.3);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      font-weight: 500;
      font-size: 0.875rem;
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: #fef08a;
      font-size: 0.75rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #eab308;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span> Offline Mode
    </div>
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>
      Network connection is unavailable. LITN automatically keeps your cached books and data available so you can continue reading.
    </p>
    <div class="btn-group">
      <button class="btn-primary" onclick="retryConnection()">Retry Connection</button>
      <button class="btn-secondary" onclick="goBackToHome()">Back to Home</button>
    </div>
  </div>

  <script>
    function retryConnection() {
      window.location.reload();
    }

    function goBackToHome() {
      if (window.history.length > 1) {
        window.history.back();
        setTimeout(function() {
          var locale = localStorage.getItem("litn_locale") || "fr";
          window.location.href = "/" + locale + "/home";
        }, 250);
      } else {
        var locale = localStorage.getItem("litn_locale") || "fr";
        window.location.href = "/" + locale + "/home";
      }
    }

    window.addEventListener("online", function() {
      window.location.reload();
    });
  </script>
</body>
</html>
